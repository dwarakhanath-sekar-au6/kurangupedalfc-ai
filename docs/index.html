<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KuranguPedalFC.ai</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background:#0f172a; color:#e2e8f0; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 32px; }
    .card { background:#1e293b; border:1px solid #334155; border-radius:16px; padding:20px; margin:16px 0; }
    .grid { display:grid; gap:16px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    h1 { margin: 0 0 8px; }
    .muted { color:#94a3b8; }
    .pill { display:inline-block; padding:6px 10px; border-radius:999px; background:#4f46e5; color:white; font-size:12px; margin-right:8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>KuranguPedalFC.ai</h1>
    <p class="muted">Your fantasy football AI manager</p>

    <div>
      <span class="pill">Planner Agent</span>
      <span class="pill">Injury Agent</span>
      <span class="pill">Judge Agent</span>
    </div>

    <div class="grid" id="kpis"></div>

    <div class="card">
      <h2>AI Insights</h2>
      <div id="insights"></div>
    </div>

    <div class="card">
      <h2>Dream Team</h2>
      <div id="squad"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
